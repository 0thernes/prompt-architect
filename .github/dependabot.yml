version: 2

updates:
  # GitHub Actions — keeps action versions from drifting.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci):"

  # npm — the project ships zero runtime deps, but CI installs ajv / js-yaml
  # ad hoc; Dependabot still watches for advisory notices against these.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, npm]
    commit-message:
      prefix: "chore(deps):"
    # Ignore minor and patch bumps for CI-only validator deps unless security.
    # Majors always require a manual review since Ajv v8→v9 or js-yaml v4→v5
    # could break scripts/validate.mjs.
    ignore:
      - dependency-name: "ajv"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "ajv-formats"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

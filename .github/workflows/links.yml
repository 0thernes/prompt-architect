name: Link checker

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/**"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
  schedule:
    # Every Monday at 07:15 UTC — offset from CI to spread GitHub Actions load.
    - cron: "15 7 * * 1"
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Check README and all docs; exclude localhost and file:// refs.
          args: >-
            --verbose
            --no-progress
            --exclude "^file://"
            --exclude "^mailto:"
            --exclude "^https://github.com/0thernes/prompt-architect"
            README.md
            docs/**/*.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            SECURITY.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

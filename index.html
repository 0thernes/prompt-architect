<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Architect — PoC</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1d2130; --line: #2a2f42;
    --text: #e6e8f0; --muted: #8a90a6; --accent: #7aa2ff; --warn: #ffb86b;
    --ok: #6fe3a1; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  header { padding: 1.2rem 1.5rem 0.4rem; }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.02em; }
  header p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.9rem; }
  main {
    display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
    gap: 1rem; padding: 1rem 1.5rem 2rem; align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
  .panel h2 { margin: 0 0 0.6rem; font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .row { margin-bottom: 0.9rem; }
  .row > label, .row legend { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.25rem; }
  .row .hint { color: var(--muted); font-size: 0.78rem; margin: 0.2rem 0 0; }
  .row .req { color: var(--warn); }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 0.45rem 0.6rem;
    font: inherit;
  }
  textarea { min-height: 4.2em; resize: vertical; font-family: var(--mono); font-size: 0.85rem; }
  input[type="range"] { width: calc(100% - 4.5rem); vertical-align: middle; accent-color: var(--accent); }
  .range-val { display: inline-block; width: 4rem; text-align: right; font-family: var(--mono); font-size: 0.85rem; color: var(--accent); }
  fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.7rem; margin: 0; }
  .check { display: flex; gap: 0.5rem; align-items: center; font-size: 0.88rem; }
  .out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
  .out-head h2 { margin: 0; }
  button {
    background: var(--accent); color: #0b0d12; border: 0; border-radius: 6px;
    padding: 0.4rem 0.9rem; font: inherit; font-weight: 700; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  pre#output {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.8rem; min-height: 6em; white-space: pre-wrap; word-break: break-word;
    font-family: var(--mono); font-size: 0.85rem; margin: 0;
  }
  #meta { font-size: 0.78rem; color: var(--muted); margin: 0.5rem 0 0; }
  #meta.over { color: var(--warn); font-weight: 700; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Prompt Architect</h1>
  <p>Schema-driven prompt builder — pick a target generator, fill the form, copy a perfect one-shot prompt. No AI, no build step, no app-hopping.</p>
</header>
<main>
  <section class="panel" aria-label="Generator form">
    <h2>Build</h2>
    <div class="row">
      <label for="gen-select">Target generator</label>
      <select id="gen-select"></select>
    </div>
    <!-- not a <form>: nothing is ever submitted; assembly is live on input -->
    <div id="builder"></div>
  </section>
  <section class="panel" aria-label="Assembled prompt">
    <div class="out-head">
      <h2>Assembled prompt</h2>
      <button type="button" id="copy-btn">Copy</button>
    </div>
    <pre id="output"></pre>
    <p id="meta"></p>
  </section>
</main>
<script type="module">
/* PoC NOTE: in the MVP, plugins load from ../generators/*.yaml and are
 * validated against ../schemas/generator.schema.json. For this zero-build PoC
 * they are embedded as JS objects (verbatim mirrors of the YAML files) so the
 * page runs from file:// with no fetch/CORS and no YAML parser dependency.
 *
 * The template engine lives in ./engine.js (imported below). The form renderer
 * and DOM wiring remain here; engine.js is browser + Node compatible ESM with
 * zero dependencies. */
import { assemble, isVisible, isSet, formatValue } from "./engine.js";

const GENERATORS = [
{
  id: "midjourney", name: "Midjourney", modality: "image", version: "1.1.0",
  fields: [
    { key: "subject", label: "Subject / scene", type: "string", required: true, multiline: true,
      placeholder: "a lighthouse keeper reading by candlelight, oil painting, dramatic chiaroscuro",
      description: "Main prompt body. Midjourney weighs earlier words more heavily." },
    { key: "style_refs", label: "Style reference URLs (--sref)", type: "string",
      placeholder: "https://example.com/ref1.png", description: "Space-separated image URLs. Empty = flag omitted." },
    { key: "negative", label: "Exclude (--no)", type: "string",
      placeholder: "text, watermark, frame", description: "Comma-separated concepts to suppress." },
    { key: "aspect_ratio", label: "Aspect ratio (--ar)", type: "enum", default: "1:1",
      options: ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3", "21:9"] },
    { key: "niji_version", label: "Niji anime model (--niji)", type: "enum", default: "none",
      omitIfDefault: true,
      options: [
        { value: "none", label: "Off — use standard --v model" },
        { value: "6",    label: "Niji 6 (current)" },
        { value: "5",    label: "Niji 5" }
      ],
      description: "Selects the Niji anime model. When set, --niji replaces --v (computed-token rename)." },
    { key: "model_version", label: "Model version (--v)", type: "enum", default: "7",
      options: [ { value: "7", label: "v7 (current)" }, { value: "6.1", label: "v6.1" },
                 { value: "6", label: "v6" }, { value: "5.2", label: "v5.2 (legacy)" } ],
      dependsOn: [{ field: "niji_version", operator: "equals", value: "none" }],
      description: "Standard model. Hidden when Niji anime model is selected." },
    { key: "stylize", label: "Stylize (--stylize)", type: "number", default: 100, omitIfDefault: true,
      range: { min: 0, max: 1000, step: 10 }, description: "100 is Midjourney's default; flag omitted at 100." },
    { key: "chaos", label: "Chaos (--chaos)", type: "number", default: 0, omitIfDefault: true,
      range: { min: 0, max: 100, step: 1 } },
    { key: "weird", label: "Weird (--weird)", type: "number", default: 0, omitIfDefault: true,
      range: { min: 0, max: 3000, step: 50 } },
    { key: "seed", label: "Seed (--seed)", type: "number", range: { min: 0, max: 4294967295, step: 1 },
      placeholder: "blank = random", description: "Blank lets Midjourney pick a random seed." }
  ],
  computedTokens: [
    { id: "niji_flag", emit: "--niji", description: "Active when niji_version is not 'none'.",
      when: [{ field: "niji_version", operator: "notEquals", value: "none" }] }
  ],
  promptTemplate:
    "{{subject}}{{#style_refs}} --sref {{style_refs}}{{/style_refs}}" +
    "{{#negative}} --no {{negative}}{{/negative}}" +
    " --ar {{aspect_ratio}}" +
    "{{#=niji_flag}} {{=niji_flag}} {{niji_version}}{{/=niji_flag}}" +
    "{{#model_version}} --v {{model_version}}{{/model_version}}" +
    "{{#stylize}} --stylize {{stylize}}{{/stylize}}" +
    "{{#chaos}} --chaos {{chaos}}{{/chaos}}" +
    "{{#weird}} --weird {{weird}}{{/weird}}" +
    "{{#seed}} --seed {{seed}}{{/seed}}",
  outputRules: {
    parameterOrder: ["subject","style_refs","negative","aspect_ratio","niji_version","model_version","stylize","chaos","weird","seed"],
    separator: " ", listSeparator: ", ", maxLength: 2000, overflowStrategy: "warn",
    collapseWhitespace: true, trim: true
  }
},
{
  id: "stable-diffusion", name: "Stable Diffusion (A1111 WebUI)", modality: "image", version: "1.0.0",
  fields: [
    { key: "positive_prompt", label: "Prompt", type: "string", required: true, multiline: true,
      placeholder: "masterpiece, ultra-detailed portrait of a clockwork owl, brass and copper",
      description: "Positive prompt; (word:1.2) weights pass through untouched." },
    { key: "negative_prompt", label: "Negative prompt", type: "string", multiline: true,
      placeholder: "lowres, bad anatomy, watermark", description: "Whole line omitted when empty." },
    { key: "steps", label: "Sampling steps", type: "number", default: 20, range: { min: 1, max: 150, step: 1 } },
    { key: "sampler", label: "Sampler", type: "enum", default: "DPM++ 2M Karras",
      options: ["DPM++ 2M Karras","DPM++ SDE Karras","DPM++ 2M SDE Exponential","Euler a","Euler","Heun","UniPC","DDIM"] },
    { key: "cfg_scale", label: "CFG scale", type: "number", default: 7, range: { min: 1, max: 30, step: 0.5 } },
    { key: "seed", label: "Seed", type: "number", default: -1, range: { min: -1, max: 4294967295, step: 1 },
      description: "-1 = random. Always emitted: the paste format expects the key." },
    { key: "width", label: "Width", type: "number", default: 1024, unit: "px", range: { min: 256, max: 2048, step: 64 } },
    { key: "height", label: "Height", type: "number", default: 1024, unit: "px", range: { min: 256, max: 2048, step: 64 } },
    { key: "hires_fix", label: "Hires. fix", type: "boolean", default: false,
      description: "Two-pass upscaled generation." },
    { key: "hires_upscaler", label: "Hires upscaler", type: "enum", default: "R-ESRGAN 4x+",
      options: ["Latent","Latent (nearest-exact)","R-ESRGAN 4x+","ESRGAN_4x","SwinIR 4x","4x-UltraSharp"],
      dependsOn: [ { field: "hires_fix", operator: "truthy" } ],
      description: "Only shown when Hires. fix is on (dependsOn demo)." }
  ],
  computedTokens: [],
  promptTemplate:
    "{{positive_prompt}}{{#negative_prompt}}\nNegative prompt: {{negative_prompt}}{{/negative_prompt}}\n" +
    "Steps: {{steps}}, Sampler: {{sampler}}, CFG scale: {{cfg_scale}}, Seed: {{seed}}, Size: {{width}}x{{height}}" +
    "{{#hires_fix}}, Hires upscaler: {{hires_upscaler}}{{/hires_fix}}",
  outputRules: {
    parameterOrder: ["positive_prompt","negative_prompt","steps","sampler","cfg_scale","seed","width","height","hires_fix","hires_upscaler"],
    separator: " ", listSeparator: ", ", overflowStrategy: "warn",
    collapseWhitespace: true, trim: true
  }
}
];

const $ = (sel) => document.querySelector(sel);
const form = $("#builder"), out = $("#output"), meta = $("#meta"), sel = $("#gen-select");
let gen = GENERATORS[0];
let state = {};

/* ---------- form rendering, one control per schema field ---------- */
function controlFor(field) {
  const wrap = document.createElement("div");
  wrap.className = "row"; wrap.dataset.key = field.key;
  const set = (v) => { state[field.key] = v; refresh(); };
  const label = document.createElement("label");
  label.htmlFor = "f-" + field.key;
  // textContent (not innerHTML): field.label comes from untrusted plugin YAML — keep it inert (no XSS).
  label.textContent = field.label;
  if (field.required) {
    label.appendChild(document.createTextNode(" "));
    const req = document.createElement("span");
    req.className = "req";
    req.textContent = "*";
    label.appendChild(req);
  }
  wrap.appendChild(label);

  if (field.type === "string") {
    const el = document.createElement(field.multiline ? "textarea" : "input");
    if (!field.multiline) el.type = "text";
    el.autocomplete = "off";
    el.id = "f-" + field.key; el.placeholder = field.placeholder || "";
    el.value = field.default ?? "";
    el.addEventListener("input", () => set(el.value));
    wrap.appendChild(el);
  } else if (field.type === "number" && field.default !== undefined) {
    // numbers WITH a default render as sliders; the value is always defined
    const el = document.createElement("input");
    el.type = "range"; el.id = "f-" + field.key;
    el.min = field.range.min; el.max = field.range.max; el.step = field.range.step ?? 1;
    el.value = field.default;
    const val = document.createElement("span"); val.className = "range-val";
    val.textContent = field.default + (field.unit ? " " + field.unit : "");
    el.addEventListener("input", () => {
      val.textContent = el.value + (field.unit ? " " + field.unit : "");
      set(Number(el.value));
    });
    wrap.append(el, val);
  } else if (field.type === "number") {
    // numbers WITHOUT a default render as blank-able inputs (unset => flag omitted)
    const el = document.createElement("input");
    el.type = "number"; el.id = "f-" + field.key;
    el.min = field.range.min; el.max = field.range.max; el.step = field.range.step ?? 1;
    el.placeholder = field.placeholder || "";
    el.addEventListener("input", () => set(el.value === "" ? undefined : Number(el.value)));
    wrap.appendChild(el);
  } else if (field.type === "boolean") {
    label.remove();
    const lab = document.createElement("label"); lab.className = "check";
    const el = document.createElement("input");
    el.type = "checkbox"; el.id = "f-" + field.key; el.checked = field.default === true;
    el.addEventListener("change", () => set(el.checked));
    lab.append(el, document.createTextNode(" " + field.label));
    wrap.appendChild(lab);
  } else if (field.type === "enum") {
    const el = document.createElement("select"); el.id = "f-" + field.key;
    for (const opt of field.options) {
      const o = document.createElement("option");
      o.value = typeof opt === "object" ? opt.value : opt;
      o.textContent = typeof opt === "object" ? opt.label : opt;
      el.appendChild(o);
    }
    if (field.default !== undefined) el.value = field.default;
    el.addEventListener("change", () => set(el.value));
    wrap.appendChild(el);
  } else if (field.type === "multi") {
    const fs = document.createElement("fieldset");
    for (const opt of field.options) {
      const v = typeof opt === "object" ? opt.value : opt;
      const lab = document.createElement("label"); lab.className = "check";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = v;
      cb.addEventListener("change", () => {
        const cur = new Set(state[field.key] || []);
        cb.checked ? cur.add(v) : cur.delete(v);
        set([...cur]);
      });
      lab.append(cb, document.createTextNode(" " + (typeof opt === "object" ? opt.label : opt)));
      fs.appendChild(lab);
    }
    wrap.appendChild(fs);
  }
  if (field.description) {
    const hint = document.createElement("p");
    hint.className = "hint"; hint.textContent = field.description;
    wrap.appendChild(hint);
  }
  return wrap;
}

function buildForm() {
  form.textContent = "";
  state = {};
  for (const f of gen.fields) {
    if (f.default !== undefined) state[f.key] = f.default;
    form.appendChild(controlFor(f));
  }
  refresh();
}

function refresh() {
  // Show/hide rows based on dependsOn — delegates to engine.isVisible
  for (const f of gen.fields) {
    const row = form.querySelector(`[data-key="${f.key}"]`);
    if (row) row.classList.toggle("hidden", !isVisible(f, state));
  }
  // Assemble prompt via engine.assemble
  const { text, charCount, overLimit } = assemble(gen, state);
  out.textContent = text;
  const rules = gen.outputRules;
  if (rules.maxLength) {
    meta.textContent = `${charCount} chars · limit ${rules.maxLength}` +
      (overLimit ? " — OVER LIMIT" : "");
    meta.className = overLimit ? "over" : "";
  } else {
    meta.textContent = `${charCount} chars · no hard limit for this target`;
    meta.className = "";
  }
}

/* ---------- generator picker & copy ---------- */
for (const g of GENERATORS) {
  const o = document.createElement("option");
  o.value = g.id; o.textContent = `${g.name} (${g.modality})`;
  sel.appendChild(o);
}
sel.addEventListener("change", () => {
  gen = GENERATORS.find((g) => g.id === sel.value);
  buildForm();
});
$("#copy-btn").addEventListener("click", async () => {
  const btn = $("#copy-btn");
  try {
    await navigator.clipboard.writeText(out.textContent);
    btn.textContent = "Copied ✓";
  } catch {
    const r = document.createRange(); r.selectNodeContents(out);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = "Select + Ctrl+C";
  }
  setTimeout(() => { btn.textContent = "Copy"; }, 1500);
});

buildForm();
</script>
</body>
</html>
